[project]
name = "gr-remote-rag"
version = "0.1.0"
description = "Remote Maharashtra government resolution RAG prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "google-genai>=1,<2",
    "numpy>=1.26,<3",
    "python-dotenv>=1,<2",
    "qdrant-client>=1.14,<2",
    "requests>=2.31,<3",
    "sentence-transformers>=3,<6",
    "uvicorn[standard]>=0.30,<1",
]

[tool.uv]
package = false
